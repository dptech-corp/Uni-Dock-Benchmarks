# ============================================================
# Uni-Dock Benchmark Configuration Template
# ============================================================
#
# Two formats are supported:
#
#   1. Multi-task (this file):  top-level "tasks" list.
#      Tasks execute SERIALLY (one after another).
#
#   2. Legacy single-task:  top-level engine/benchmark/output/runs
#      (still fully supported — treated as one task internally).
#
# Run with:
#   ./run.sh your_config.yaml            # background (nohup)
#   ./run.sh your_config.yaml --fg       # foreground (debugging)
#
# ============================================================

tasks:

  # ---------------------------------------------------------
  # Task 1 — Virtual Screening, with water
  # ---------------------------------------------------------
  - engine:
      version: 2                         # Uni-Dock version: 1 | 2
      binary: "ud2"                      # Path or name of the docking binary

    benchmark:
      type: "virtual_screening"          # "molecular_docking" | "virtual_screening"
      nowater: false                     # true = protein-only receptor
      datasets: null                     # null = all datasets for the given type
                                         # Or specify a list:
                                         #   ["D4", "GBA", "NSP3", "PPARG", "sigma2"]

    # output.savedir is OPTIONAL.
    # If omitted, auto-generated as: results/<binary_name>_<dock|screen>_<water|nowater>
    # e.g. results/ud2_screen_water
    output:
      savedir: "results/my_screen_water"

    # Scheduling rules (same as before):
    #   - Same device  → SEQUENTIAL
    #   - Different devices → PARALLEL
    runs:
      - seed: 121
        device: 0
      - seed: 122
        device: 1
      - seed: 123
        device: 2

  # ---------------------------------------------------------
  # Task 2 — Molecular Docking, no water  (savedir auto-generated)
  # ---------------------------------------------------------
  - engine:
      version: 2
      binary: "ud2"

    benchmark:
      type: "molecular_docking"
      nowater: true
      datasets: null                     # Available: Astex, CASF2016, PoseBuster

    # output section omitted → savedir auto-generated as results/ud2_dock_nowater

    runs:
      - seed: 121
        device: 0
      - seed: 122
        device: 1
      - seed: 123
        device: 2
